<svg width="1400" height="300" viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated market pulse">
  <defs>
    <linearGradient id="pulseBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <rect width="1400" height="300" rx="22" fill="url(#pulseBg)" />
  <text x="48" y="58" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">
    Live-style Probability Pulse (Animation)
  </text>

  <polyline
    points="60,225 180,210 280,220 390,170 490,185 610,142 730,160 850,118 970,130 1100,92 1220,104 1340,72"
    fill="none"
    stroke="url(#glow)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  >
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite" />
  </polyline>

  <g fill="#38bdf8" opacity="0.8">
    <rect x="90"  y="185" width="28" height="60" rx="6">
      <animate attributeName="height" values="40;75;40" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="205;170;205" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="140" y="170" width="28" height="75" rx="6">
      <animate attributeName="height" values="75;45;75" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="170;200;170" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="190" y="150" width="28" height="95" rx="6">
      <animate attributeName="height" values="95;55;95" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="150;190;150" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="240" y="175" width="28" height="70" rx="6">
      <animate attributeName="height" values="50;88;50" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="195;157;195" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <circle cx="1340" cy="72" r="8" fill="#22c55e">
    <animate attributeName="r" values="6;11;6" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
